# Description de la configuration d'Ascender. Les secrets sont dans secrets.yml (chiffré).

organisation: Plateforme

depot_git: "https://github.com/MON-ORG/plateforme-k8s.git"   # À ADAPTER
depot_branche: main

ee_image: "registre.mondomaine.com/plateforme/ee:1.0.0"      # À ADAPTER

environnements: [unitaire, prod]

# Étapes enchaînées par le workflow « Construire l'environnement »
etapes:
  - { id: provisionner, nom: "10 - Provisionner",       playbook: ansible/playbooks/10-provisionner.yml }
  - { id: preparer-os,  nom: "20 - Préparer l'OS",      playbook: ansible/playbooks/20-preparer-os.yml }
  - { id: rancher,      nom: "30 - Installer Rancher",  playbook: ansible/playbooks/30-installer-rancher.yml }
  - { id: clusters,     nom: "40 - Créer les clusters", playbook: ansible/playbooks/40-creer-clusters.yml }
  - { id: verifier,     nom: "50 - Vérifier",           playbook: ansible/playbooks/50-verifier.yml }

# Qui peut lancer quoi
equipes:
  - nom: Développeurs
    peut_lancer: [unitaire]
  - nom: Administrateurs plateforme
    peut_lancer: [unitaire, prod]
