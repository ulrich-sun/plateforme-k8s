# Configuration d'Ascender EN CODE (collection awx.awx, compatible Ascender car basé sur AWX).
# Plus de clics : on peut reconstruire Ascender à l'identique, et chaque changement passe par Git.
#
#   export CONTROLLER_HOST=https://<IP_PUBLIQUE_ASCENDER>
#   export CONTROLLER_USERNAME=admin
#   export CONTROLLER_PASSWORD=...
#   export CONTROLLER_VERIFY_SSL=false
#   ansible-playbook configurer-ascender.yml --ask-vault-pass
#
# Résultat dans Ascender :
#   - par environnement : 3 credentials, 6 job templates, 1 workflow « Construire », 1 « Détruire »
#   - en prod : une étape d'APPROBATION humaine avant toute action
#   - l'équipe Développeurs ne peut lancer que l'unitaire

- name: Configurer Ascender
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
    - secrets.yml

  tasks:
    # ---------- Socle ----------

    - name: Organisation
      awx.awx.organization:
        name: "{{ organisation }}"

    - name: Execution Environment
      awx.awx.execution_environment:
        organization: "{{ organisation }}"
        name: EE Plateforme
        image: "{{ ee_image }}"
        pull: missing

    - name: Projet (le dépôt Git de ce code)
      awx.awx.project:
        organization: "{{ organisation }}"
        name: plateforme-k8s
        scm_type: git
        scm_url: "{{ depot_git }}"
        scm_branch: "{{ depot_branche }}"
        scm_update_on_launch: true   # chaque job utilise le dernier commit
        default_environment: EE Plateforme
        wait: true

    - name: Inventaire de pilotage (les vrais hôtes viennent de Terraform à l'exécution)
      awx.awx.inventory:
        organization: "{{ organisation }}"
        name: Pilotage

    - name: Hôte localhost
      awx.awx.host:
        name: localhost
        inventory: Pilotage
        variables:
          ansible_connection: local

    - name: Type de credential « Rancher »
      awx.awx.credential_type:
        name: Rancher
        kind: cloud
        inputs:
          fields:
            - id: bootstrap_password
              label: Mot de passe initial de Rancher
              type: string
              secret: true
          required: [bootstrap_password]
        injectors:
          extra_vars:
            rancher_bootstrap_password: "{{ '{{' }} bootstrap_password {{ '}}' }}"

    # ---------- Credentials par environnement ----------

    - name: Credentials AWS
      awx.awx.credential:
        organization: "{{ organisation }}"
        name: "AWS {{ item }}"
        credential_type: Amazon Web Services
        inputs:
          username: "{{ secrets[item].aws_access_key }}"
          password: "{{ secrets[item].aws_secret_key }}"
      loop: "{{ environnements }}"
      no_log: true

    - name: Credentials SSH
      awx.awx.credential:
        organization: "{{ organisation }}"
        name: "SSH {{ item }}"
        credential_type: Machine
        inputs:
          username: ubuntu
          ssh_key_data: "{{ secrets[item].ssh_cle_privee }}"
          become_method: sudo
      loop: "{{ environnements }}"
      no_log: true

    - name: Credentials Rancher
      awx.awx.credential:
        organization: "{{ organisation }}"
        name: "Rancher {{ item }}"
        credential_type: Rancher
        inputs:
          bootstrap_password: "{{ secrets[item].rancher_bootstrap_password }}"
      loop: "{{ environnements }}"
      no_log: true

    # ---------- Job templates : une étape × un environnement ----------

    - name: Job templates des étapes
      awx.awx.job_template:
        organization: "{{ organisation }}"
        name: "[{{ item.0 }}] {{ item.1.nom }}"
        project: plateforme-k8s
        playbook: "{{ item.1.playbook }}"
        inventory: Pilotage
        execution_environment: EE Plateforme
        credentials:
          - "AWS {{ item.0 }}"
          - "SSH {{ item.0 }}"
          - "Rancher {{ item.0 }}"
        extra_vars:
          environnement: "{{ item.0 }}"
        become_enabled: false   # chaque play décide lui-même (become: true)
      loop: "{{ environnements | product(etapes) | list }}"
      loop_control:
        label: "[{{ item.0 }}] {{ item.1.nom }}"

    - name: Job templates de destruction
      awx.awx.job_template:
        organization: "{{ organisation }}"
        name: "[{{ item }}] 90 - Détruire"
        project: plateforme-k8s
        playbook: ansible/playbooks/90-detruire.yml
        inventory: Pilotage
        execution_environment: EE Plateforme
        credentials: ["AWS {{ item }}"]
        extra_vars:
          environnement: "{{ item }}"
        survey_enabled: true
        survey_spec:
          name: Confirmation
          description: Destruction irréversible
          spec:
            - question_name: "Retapez le nom de l'environnement pour confirmer"
              variable: confirmation
              type: text
              required: true
      loop: "{{ environnements }}"

    # ---------- Workflows ----------

    - name: Workflow « Construire l'environnement »
      awx.awx.workflow_job_template:
        organization: "{{ organisation }}"
        name: "[{{ item }}] Construire l'environnement"
        inventory: Pilotage
        destroy_current_nodes: true
        workflow_nodes: "{{ noeuds_approbation + noeuds_etapes }}"
      loop: "{{ environnements }}"
      vars:
        env: "{{ item }}"
        # En prod, un humain doit approuver avant que quoi que ce soit ne bouge.
        noeuds_approbation: >-
          {{ [{
               'identifier': 'approbation',
               'approval_node': {
                 'name': 'Approbation prod',
                 'description': 'Un administrateur doit approuver la modification de la prod',
                 'timeout': 3600
               },
               'related': {'success_nodes': [{'identifier': etapes[0].id}]}
             }] if env == 'prod' else [] }}
        noeuds_etapes: >-
          {%- set l = [] -%}
          {%- for e in etapes -%}
            {%- set suivant = [{'identifier': etapes[loop.index].id}] if not loop.last else [] -%}
            {%- set _ = l.append({
                  'identifier': e.id,
                  'unified_job_template': {
                    'name': '[' ~ env ~ '] ' ~ e.nom,
                    'type': 'job_template',
                    'organization': {'name': organisation}
                  },
                  'related': {'success_nodes': suivant}
                }) -%}
          {%- endfor -%}
          {{ l }}

    # ---------- Droits ----------

    - name: Équipes
      awx.awx.team:
        organization: "{{ organisation }}"
        name: "{{ item.nom }}"
      loop: "{{ equipes }}"

    - name: Droit de lancer les workflows
      awx.awx.role:
        team: "{{ item.0.nom }}"
        role: execute
        workflows:
          - "[{{ item.1 }}] Construire l'environnement"
      loop: "{{ equipes | subelements('peut_lancer') }}"
      loop_control:
        label: "{{ item.0.nom }} → {{ item.1 }}"

    - name: Seuls les administrateurs peuvent détruire et approuver
      awx.awx.role:
        team: Administrateurs plateforme
        role: admin
        organizations: ["{{ organisation }}"]
