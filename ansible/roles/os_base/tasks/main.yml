# Socle commun : ce qu'il faut sur TOUTE machine avant Kubernetes.
# Le durcissement de sécurité d'entreprise (CIS, auditd, comptes) se rajoute ici.

- name: Nom d'hôte = nom dans l'inventaire
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Fuseau horaire
  community.general.timezone:
    name: "{{ os_base_fuseau }}"

- name: Paquets de base
  ansible.builtin.apt:
    name: "{{ os_base_paquets }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Services de base actifs
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [chrony, iscsid]

- name: Désactiver le swap (exigence de Kubernetes)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Retirer le swap de /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Modules noyau pour le réseau des conteneurs
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]

- name: Paramètres noyau
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    reload: true
  loop: "{{ parametres | dict2items }}"
  vars:
    parametres:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
      fs.inotify.max_user_instances: 8192
      fs.inotify.max_user_watches: 524288

# Sur AWS, le filtrage est fait par les security groups : on évite un second pare-feu
# local qui casserait le trafic de Cilium.
- name: Désactiver ufw
  community.general.ufw:
    state: disabled
  failed_when: false
