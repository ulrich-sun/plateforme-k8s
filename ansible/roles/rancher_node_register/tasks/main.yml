# Exécute sur chaque nœud la commande d'enregistrement de son cluster, avec ses rôles.
# Rancher installe ensuite rancher-system-agent, puis RKE2, puis le fleet-agent.

- name: Rôles RKE2 du nœud
  ansible.builtin.set_fact:
    drapeaux_roles: >-
      {{ '--etcd --controlplane' if rke2_role == 'controlplane' else '--worker' }}

- name: Enregistrer le nœud dans son cluster
  ansible.builtin.shell:
    cmd: >-
      {{ hostvars['localhost'].commandes_enregistrement[cluster_name] }}
      {{ drapeaux_roles }}
      --node-name {{ inventory_hostname }}
      --address {{ ansible_host }}
      --internal-address {{ ansible_host }}
    creates: /etc/systemd/system/rancher-system-agent.service
  no_log: true   # la commande contient le jeton d'enregistrement

- name: Agent Rancher actif
  ansible.builtin.systemd_service:
    name: rancher-system-agent
    state: started
    enabled: true
